services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routecommunity}
      POSTGRES_USER: ${POSTGRES_USER:-routecommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routecommunity}
    ports:
      - "${POSTGRES_PORT:-8152}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gpx-storage-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /data/gpx"]
    volumes:
      - gpx_data:/data/gpx
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-routecommunity}
      POSTGRES_USER: ${POSTGRES_USER:-routecommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routecommunity}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8150}
      GPX_MAX_FILE_SIZE: ${GPX_MAX_FILE_SIZE:-10MB}
      GPX_MAX_REQUEST_SIZE: ${GPX_MAX_REQUEST_SIZE:-11MB}
      GPX_MAX_FILE_SIZE_BYTES: ${GPX_MAX_FILE_SIZE_BYTES:-10485760}
      GPX_STORAGE_PATH: ${GPX_STORAGE_PATH:-/data/gpx}
    ports:
      - "${API_PORT:-8151}:8080"
    volumes:
      - gpx_data:/data/gpx
    depends_on:
      db:
        condition: service_healthy
      gpx-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8151}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8151}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    ports:
      - "${WEB_PORT:-8150}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  gpx_data:
