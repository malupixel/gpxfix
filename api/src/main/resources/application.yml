spring:
  application:
    name: route-community-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/routecommunity}
    username: ${POSTGRES_USER:routecommunity}
    password: ${POSTGRES_PASSWORD:routecommunity}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${GPX_MAX_FILE_SIZE:10MB}
      max-request-size: ${GPX_MAX_REQUEST_SIZE:11MB}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  gpx:
    max-file-size-bytes: ${GPX_MAX_FILE_SIZE_BYTES:10485760}
  storage:
    gpx-path: ${GPX_STORAGE_PATH:./data/gpx}
  ownership:
    cookie-secure: ${OWNER_COOKIE_SECURE:true}
    session-days: ${OWNER_SESSION_DAYS:30}
